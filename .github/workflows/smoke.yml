# Installs a rulex-engine version on macOS and Windows runners, both
# architectures, and runs the smoke tests in tests/ against it.
#
# The wheels come from one of three places:
#   testpypi / pypi  - the given version from that index, with no dependencies
#                      and no other index, so only the published wheel is used.
#   draft-release    - the .whl assets of the draft release tagged `version` in
#                      this repository. Draft assets are not public.
#
# Only the `fetch` job holds a write permission, which is what reading a draft
# release needs. The test jobs read the wheels from an artifact and run with
# read-only contents.
#
# Every action is pinned to a commit SHA, with its release as a comment, and
# setup-uv installs a pinned uv.
name: smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "rulex-engine version, or the draft release tag for draft-release"
        required: true
      source:
        description: "Where the wheels come from"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
          - draft-release
  repository_dispatch:
    types: [smoke]

permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
  SOURCE: ${{ github.event.inputs.source || github.event.client_payload.source || 'testpypi' }}
  UV_VERSION: "0.13.7"

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Download the wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The version reaches shell commands and a jq pattern, so it is
          # limited to the characters a version or tag uses.
          printf '%s' "$VERSION" | grep -Eq '^v?[0-9][0-9A-Za-z.+-]*$' || { echo "bad version: $VERSION" >&2; exit 1; }
          mkdir -p wheels
          case "$SOURCE" in
            draft-release)
              gh release download "$VERSION" -R "$GITHUB_REPOSITORY" -p '*.whl' -D wheels
              ;;
            testpypi|pypi)
              if [ "$SOURCE" = pypi ]; then index=https://pypi.org/simple/; else index=https://test.pypi.org/simple/; fi
              # The simple index lists every file of the version with its
              # SHA-256, so each wheel is fetched and checked against it.
              curl -fsS -H 'Accept: application/vnd.pypi.simple.v1+json' "$index/rulex-engine/" \
                | jq -r --arg v "$VERSION" '.files[] | select(.filename | test("^rulex_engine-" + $v + "-.*\\.whl$")) | [.url, .filename, .hashes.sha256] | @tsv' \
                > files.tsv
              test -s files.tsv || { echo "no wheels for rulex-engine $VERSION on $index" >&2; exit 1; }
              while IFS="$(printf '\t')" read -r url name sha; do
                curl -fsS -o "wheels/$name" "$url"
                echo "$sha  wheels/$name" | sha256sum -c -
              done < files.tsv
              ;;
            *)
              echo "unknown source: $SOURCE" >&2
              exit 1
              ;;
          esac
          ls -l wheels

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels
          path: wheels/*.whl
          if-no-files-found: error

  smoke:
    needs: fetch
    name: ${{ matrix.os }} ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A healthy run takes a few minutes. The tests kill hung children after
    # 120 seconds, and this bounds anything they miss.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, windows-11-arm]
        python: ["3.8", "3.13", "3.14t"]
        exclude:
          # python.org has no Windows arm64 build before 3.11.
          - os: windows-11-arm
            python: "3.8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: wheels

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      # uv on Windows rejects the `3.13+gil` request form, and a plain version
      # selects the GIL build, so the version is passed as given.
      - name: Install Python and the wheel
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          set -eu
          uv python install "$PYTHON"
          uv venv -p "$PYTHON" .venv
          uv pip install --python .venv \
            "pytest==8.3.5; python_version < '3.9'" \
            "pytest==8.4.2; python_version == '3.9'" \
            "pytest==9.1.1; python_version >= '3.10'"
          uv pip install --python .venv --no-index --no-deps --find-links wheels "rulex-engine==${VERSION#v}"

      - name: Run the smoke tests
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=.venv/Scripts/python.exe; fi
          "$py" -m pytest -v -s -p no:cacheprovider tests

      # macOS writes a report with the native backtrace of every crashed
      # process. Only reports from Python processes are kept.
      - name: Collect macOS crash reports
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p crash-reports
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$dir" -maxdepth 1 \( -name 'python*' -o -name 'Python*' \) -newer .venv -exec cp {} crash-reports/ \; 2>/dev/null || true
          done
          ls -l crash-reports

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && runner.os == 'macOS'
        with:
          name: crash-reports-${{ matrix.os }}-${{ matrix.python }}
          path: crash-reports/
          if-no-files-found: ignore
